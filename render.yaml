services:
  - type: web
    name: gonaturefarms-backend
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gonaturefarms-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: gonaturefarms-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gonaturefarms-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: gonaturefarms-db
          property: databaseName
      - key: DB_USER
        fromDatabase:
          name: gonaturefarms-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gonaturefarms-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://your-frontend-url.com
      - key: ADMIN_DEFAULT_USER
        value: admin
      - key: ADMIN_DEFAULT_PASS
        generateValue: true

databases:
  - name: gonaturefarms-db
    databaseName: gonaturefarms
    user: gonaturefarms
    plan: free

# Production profile configuration for Render deployment
# Set via SPRING_PROFILES_ACTIVE=prod environment variable

spring.application.name=gonaturefarms-backend
server.port=${PORT:8080}
server.connection-timeout=300000
spring.mvc.async.request-timeout=300000

# ── Lazy Initialization (reduce startup time) ─────────────────────
spring.main.lazy-initialization=true

# ── PostgreSQL DataSource (Render environment variables override these) ─
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://gonaturefarms-salt-graph.ovh2.cloud.layerbase.dev:5432/gonaturefarms?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:cPJvP7F3td8uQJG8TJaEXTKd}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool Settings (optimized for production) ─
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.initialization-fail-timeout=5000

# ── Database schema & seed data ───────────────────────────────────
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:db/schema.sql

# ── JPA / Hibernate (Production-optimized) ─────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.generate_statistics=false

# ── Jackson (JSON) ───────────────────────────────────────────────
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# ── File uploads (admin image upload) ───────────────────────────
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
app.upload.dir=${UPLOAD_DIR:/tmp/uploads}

# ── JWT ──────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expires-in=${JWT_EXPIRES_IN:7d}

# ── CORS ─────────────────────────────────────────────────────────
app.frontend-url=${FRONTEND_URL:https://gonaturefarms-frontend.vercel.app}

# ── Default admin fallback credentials ──────────────────────────
app.admin.default-user=${ADMIN_DEFAULT_USER:Vishnu}
app.admin.default-pass=${ADMIN_DEFAULT_PASS:918252}

# ── Logging (Production) ─────────────────────────────────────────
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.com.gonaturefarms=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ── Error handling ───────────────────────────────────────────────
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.web.resources.static-locations=classpath:/static/,file:./uploads/,file:/opt/render/project/src/uploads/

# ── Cloudinary (Video/Image storage) ─────────────────────────────
cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}

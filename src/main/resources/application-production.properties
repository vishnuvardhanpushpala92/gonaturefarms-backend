# ══════════════════════════════════════════════════════════════
#  Go Nature Farms — Spring Boot Production Configuration
#  Render Deployment
# ══════════════════════════════════════════════════════════════

spring.application.name=gonaturefarms-backend

# ── PostgreSQL DataSource (Render) ─────────────────────────────
# Render provides PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
spring.datasource.url=jdbc:postgresql://${DB_HOST:dpg-d9ukvgrncjis739t99ug-a}:${DB_PORT:5432}/${DB_NAME:gnf_y4iw}
spring.datasource.username=postgres
spring.datasource.password=918252
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Database schema & seed data ───────────────────────────────────
# Hibernate will handle schema creation/update
spring.sql.init.mode=never

# ── JPA / Hibernate ──────────────────────────────────────────────
# Hibernate handles schema creation/update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Jackson (JSON) ───────────────────────────────────────────────
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# ── File uploads (admin image upload) ───────────────────────────
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
app.upload.dir=./uploads

# ── JWT ──────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:GoNatureFarms_SuperSecret_JWT_Key_2026_ChangeInProd!}
app.jwt.expires-in=7d

# ── CORS ─────────────────────────────────────────────────────────
# Render environment variable FRONTEND_URL
app.frontend-url=${FRONTEND_URL:https://gonaturefarms-frontend-fvn3mbf18-gonatuefarms.vercel.app}

# ── Default admin fallback credentials ──────────────────────────
app.admin.default-user=${ADMIN_DEFAULT_USER:Vishnu}
app.admin.default-pass=${ADMIN_DEFAULT_PASS:918252}

# ── Logging ──────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.com.gonaturefarms=INFO
logging.level.org.hibernate.SQL=ERROR

# ── Error handling ───────────────────────────────────────────────
server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-stacktrace=never

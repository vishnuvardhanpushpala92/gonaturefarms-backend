# ══════════════════════════════════════════════════════════════
#  Go Nature Farms — Spring Boot Production Configuration
#  Railway Deployment
# ══════════════════════════════════════════════════════════════

spring.application.name=gonaturefarms-backend

# ── PostgreSQL DataSource (Railway) ─────────────────────────────
# Railway provides DATABASE_URL environment variable
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gonaturefarms}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:918252}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Database schema & seed data ───────────────────────────────────
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# ── JPA / Hibernate ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Jackson (JSON) ───────────────────────────────────────────────
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# ── File uploads (admin image upload) ───────────────────────────
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
app.upload.dir=./uploads

# ── JWT ──────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:GoNatureFarms_SuperSecret_JWT_Key_2026_ChangeInProd!}
app.jwt.expires-in=7d

# ── CORS ─────────────────────────────────────────────────────────
# Railway environment variable APP_FRONTEND_URL overrides this
app.frontend-url=${APP_FRONTEND_URL:https://gonaturefarms-frontend.netlify.app}

# ── Default admin fallback credentials ──────────────────────────
app.admin.default-user=${ADMIN_DEFAULT_USER:Vishnu}
app.admin.default-pass=${ADMIN_DEFAULT_PASS:918252}

# ── Logging ──────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.com.gonaturefarms=INFO
logging.level.org.hibernate.SQL=ERROR

# ── Error handling ───────────────────────────────────────────────
server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-stacktrace=never

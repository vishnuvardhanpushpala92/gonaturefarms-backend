# ══════════════════════════════════════════════════════════════
#  Go Nature Farms — Spring Boot Production Configuration
#  Render Deployment
# ══════════════════════════════════════════════════════════════

spring.application.name=gonaturefarms-backend
server.port=${PORT:8080}

# ── Character Encoding (force UTF-8 for emoji support) ─────────
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# ── Lazy Initialization (reduce startup time) ─────────────────────
spring.main.lazy-initialization=true

# ── PostgreSQL DataSource (Render) ─────────────────────────────
# Render provides PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool Settings (optimized for production) ─
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.initialization-fail-timeout=5000

# ── Database schema & seed data ───────────────────────────────────
spring.sql.init.mode=never

# ── JPA / Hibernate ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Jackson (JSON) ───────────────────────────────────────────────
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# ── File uploads (admin image upload) ───────────────────────────
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
app.upload.dir=./uploads

# ── JWT ──────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:GoNatureFarms_SuperSecret_JWT_Key_2026_ChangeInProd!}
app.jwt.expires-in=7d

# ── CORS ─────────────────────────────────────────────────────────
# Render environment variable FRONTEND_URL
app.frontend-url=${FRONTEND_URL:https://gonaturefarms-frontend-fvn3mbf18-gonatuefarms.vercel.app}

# ── Default admin fallback credentials ──────────────────────────
app.admin.default-user=${ADMIN_DEFAULT_USER:Vishnu}
app.admin.default-pass=${ADMIN_DEFAULT_PASS:918252}

# ── Logging ──────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.com.gonaturefarms=INFO
logging.level.org.hibernate.SQL=ERROR

# ── Error handling ───────────────────────────────────────────────
server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-stacktrace=never

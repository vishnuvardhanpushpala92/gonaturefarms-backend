spring.application.name=gonaturefarms-backend
server.port=${PORT:8080}
server.connection-timeout=60000
spring.mvc.async.request-timeout=60000

# ── PostgreSQL DataSource (Hardcoded for Render) ────────────────
spring.datasource.url=jdbc:postgresql://dpg-d9ukvgrncjis739t99ug-a.virginia-postgres.render.com:5432/gnf_y4iw?sslmode=require
spring.datasource.username=gnf_y4iw_user
spring.datasource.password=bBSXUNDvv36nLDyYanOlSErourkiW0XJ
spring.datasource.driver-class-name=org.postgresql.Driver
# ── HikariCP Connection Pool Settings ─────────────────────────────
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-timeout=30000

# ── Database schema & seed data ───────────────────────────────────
# Changed to 'embedded' to only run on first startup, preserving existing data
spring.sql.init.mode=embedded
spring.sql.init.schema-locations=classpath:db/schema.sql

# ── JPA / Hibernate ──────────────────────────────────────────────
# Set to UPDATE so Hibernate automatically updates schema but preserves data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Jackson (JSON) ───────────────────────────────────────────────
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# ── File uploads (admin image upload) ───────────────────────────
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
app.upload.dir=${UPLOAD_DIR:/tmp/uploads}

# ── JWT ──────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:GoNatureFarms_SuperSecret_JWT_Key_2026_ChangeInProd!}
app.jwt.expires-in=${JWT_EXPIRES_IN:7d}

# ── CORS ─────────────────────────────────────────────────────────
app.frontend-url=${FRONTEND_URL:https://gonaturefarms-frontend.vercel.app}

# ── Default admin fallback credentials ──────────────────────────
app.admin.default-user=${ADMIN_DEFAULT_USER:Vishnu}
app.admin.default-pass=${ADMIN_DEFAULT_PASS:918252}

# ── Logging ──────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.gonaturefarms=INFO
logging.level.org.hibernate.SQL=WARN

# ── Error handling ───────────────────────────────────────────────
server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-stacktrace=on_param
spring.web.resources.static-locations=classpath:/static/,file:./uploads/,file:/opt/render/project/src/uploads/

# ── Cloudinary (Video/Image storage) ─────────────────────────────

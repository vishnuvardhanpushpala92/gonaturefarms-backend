# ══════════════════════════════════════════════════════════════
#  Go Nature Farms — Spring Boot configuration
#  Local development configuration
# ══════════════════════════════════════════════════════════════

spring.application.name=gonaturefarms-backend
server.port=8081

# ── PostgreSQL DataSource ───────────────────────────────────────
# Local development configuration

spring.datasource.url=jdbc:postgresql://localhost:5432/gonaturefarms
spring.datasource.username=postgres
spring.datasource.password=918252
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Database schema & seed data ───────────────────────────────────
# db/schema.sql is the authoritative DDL script (creates every table + seeds the
# default admin user, site settings, slides, faqs, delivery zones, coupons, etc).
# These two properties make Spring Boot actually run it automatically on every
# startup (statements use CREATE TABLE IF NOT EXISTS / ON CONFLICT DO NOTHING, so
# re-running it is safe and idempotent). Without this, the file was never executed
# by anything — it just sat on disk as a reference — leaving the database with
# zero seed rows (no admin user, no settings, no slides/faqs/zones) unless someone
# ran it by hand with psql.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# ── JPA / Hibernate ──────────────────────────────────────────────
# Schema management is owned by db/schema.sql above, so Hibernate only validates
# that entities match the already-created tables rather than also trying to
# create/alter them itself (ddl-auto=update left both mechanisms free to disagree
# with each other, which is a common source of "works on my machine" schema drift).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Jackson (JSON) ───────────────────────────────────────────────
# The naming strategy is now configured explicitly and authoritatively in
# JacksonConfig.java (which wires a hand-built Jackson 2 ObjectMapper as the actual
# HTTP JSON converter, since Spring Boot 4 defaults to Jackson 3 for HTTP conversion
# and this app's frontend contract depends on snake_case being applied reliably).
# This property is kept as a harmless secondary hint for any Jackson 2 auto-configured
# beans Spring Boot itself creates elsewhere (e.g. for actuator/error responses).
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# ── File uploads (admin image upload) ───────────────────────────
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
app.upload.dir=./uploads

# ── JWT ──────────────────────────────────────────────────────────
app.jwt.secret=GoNatureFarms_SuperSecret_JWT_Key_2026_ChangeInProd!
app.jwt.expires-in=7d

# ── CORS ─────────────────────────────────────────────────────────
# Production and development configuration
app.frontend-url=https://gonaturefarms-frontend.netlify.app,http://localhost:5173

# ── Default admin fallback credentials ──────────────────────────
# Mirrors the original Node app's hardcoded admin-login fallback (used only if no
# matching admin row exists in the database).
app.admin.default-user=Vishnu
app.admin.default-pass=918252

# ── Logging ──────────────────────────────────────────────────────
# Production logging configuration
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.gonaturefarms=INFO
logging.level.org.hibernate.SQL=WARN

# ── Error handling ───────────────────────────────────────────────
server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-stacktrace=on_param
spring.application.name=gonaturefarms-backend
server.port=${PORT:8080}
server.connection-timeout=300000
spring.mvc.async.request-timeout=300000

# ── Character Encoding (force UTF-8 for emoji support) ─────────
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# ── Lazy Initialization (reduce startup time) ─────────────────────
spring.main.lazy-initialization=false

# ── PostgreSQL DataSource (Prisma Database) ─
# Use Render environment variables for Prisma PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://pooled.db.prisma.io:5432/postgres?sslmode=require&pgbouncer=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool Settings ─────────────────────────────
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.max-lifetime=5400000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# ── Database schema & seed data ───────────────────────────────────
# CHANGED TO 'never' (Required for Prisma connection pooler)
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:db/schema.sql

# ── JPA / Hibernate ──────────────────────────────────────────────
# Keep as 'update' for the first deploy to build tables, then change to 'validate'
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# ── Jackson (JSON) ───────────────────────────────────────────────
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# ── File uploads (admin image upload) ───────────────────────────
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
app.upload.dir=${UPLOAD_DIR:/tmp/uploads}

# ── JWT ──────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:GoNatureFarms_SuperSecret_JWT_Key_2026_ChangeInProd!}
app.jwt.expires-in=${JWT_EXPIRES_IN:7d}

# ── CORS ─────────────────────────────────────────────────────────
app.frontend-url=${FRONTEND_URL:https://gonaturefarms-frontend.vercel.app}

# ── Default admin fallback credentials ──────────────────────────
app.admin.default-user=${ADMIN_DEFAULT_USER:Vishnu}
app.admin.default-pass=${ADMIN_DEFAULT_PASS:918252}

# ── Logging ──────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.gonaturefarms=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate=WARN

# ── Error handling ───────────────────────────────────────────────
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true
spring.web.resources.static-locations=classpath:/static/,file:./uploads/,file:/opt/render/project/src/uploads/

# ── Cloudinary (Video/Image storage) ─────────────────────────────
cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME:ul0dvore}
cloudinary.api.key=${CLOUDINARY_API_KEY:eZKE0F2D_EdpwdqBgS6bPEerEOs}
cloudinary.api.secret=${CLOUDINARY_API_SECRET:3F3wQ3PFCQQ8YCBjTHP_NlUkQuY}